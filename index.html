function goHome(){if(profile)showDashboard();else showLanding()}function header(actionText,actionCall){const label=actionText||(profile?'Edit my profile':'I just want to explore'),handler=actionCall||(profile?'startOver()':'showLanding()');return `<div class="shell"><nav class="nav"><button type="button" class="brand-home" onclick="goHome()" aria-label="Caira Curls home"><span class="${profile?'brandmark-full':'brandmark-crop'}"><img src="caira-logo.png" alt="Caira Curls"></span></button><button class="nav-explore" onclick="${handler}">${label}</button></nav></div>`}let welcomeWinkStarted=false;function imageDecoded(image){if(typeof image.decode==='function')return image.decode();if(image.complete&&image.naturalWidth>0)return Promise.resolve();return new Promise((resolve,reject)=>{image.addEventListener('load',resolve,{once:true});image.addEventListener('error',reject,{once:true})})}function showLanding(){document.body.classList.remove('intro-mode');document.body.classList.add('welcome-mode');app.innerHTML=`<main class="welcome-screen"><div class="welcome-brand brand-animation" id="brand-animation"><img class="logo-open" src="caira-curls-open.png" alt="Caira Curls illustrated logo"><img class="logo-wink" src="caira-curls-wink.png" alt="" aria-hidden="true"><img class="logo-open logo-wordmark" src="caira-curls-open.png" alt="" aria-hidden="true"><img class="logo-wink logo-wordmark" src="caira-curls-wink.png" alt="" aria-hidden="true"></div><button class="welcome-start" onclick="startOnboarding()">GET STARTED</button></main>`;const holder=document.querySelector('#brand-animation');const openImage=holder.querySelector('img.logo-open:not(.logo-wordmark)'),winkImage=holder.querySelector('img.logo-wink:not(.logo-wordmark)');imageDecoded(openImage).then(()=>{if(!holder.isConnected)return;holder.classList.add('logo-open-ready');if(welcomeWinkStarted||window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;return imageDecoded(winkImage).then(()=>{if(holder.isCon function showExperimentSetup(productId){const product=LAB_PRODUCTS.find(x=>x.id===productId);if(!product)return;const existing=allExperiments().find(e=>e.productId===productId&&(e.status==='active'||e.status==='decision'));if(existing)return showExperimentPage(existing.id);const draft=getLabDraft(productId);experimentSetup={productId,goals:[...draft.goals],duration:draft.duration};document.body.classList.remove('welcome-mode','intro-mode');app.innerHTML=`<main class="lab-page lab-form">${labHeader('← Experimental Lab','showLab()')}<div class="eyebrow">SET UP YOUR EXPERIMENT</div><h1>Let’s see what your curls think.</h1><article class="lab-form-card"><div class="eyebrow">PRODUCT</div><h2>${esc(product.name)}</h2><p>${esc(product.brand)} · ${esc(product.type)}</p><a class="lab-secondary" href="${esc(product.productUrl)}" target="_blank" rel="noopener">Product details</a></article><article id="lab-goals-card" class="lab-form-card"><h2>WHAT YOU WANT TO FIND OUT</h2><p id="lab-goal-hint" class="hint">Choose any that feel useful to you.</p><div class="lab-choice-grid">${LAB_GOALS.map((x,i)=>`<button type="button" class="lab-choice" data-lab-goal="${i}" aria-pressed="${experimentSetup.goals.includes(x)}">${esc(x)}</button>`).join('')}</div><div id="other-goal-wrap" class="hide" style="margin-top:12px"><input id="other-goal" class="city-input" value="${esc(draft.customGoal||'')}" placeholder="What else are you curious about?"></div></article><article class="lab-form-card"><h2>STARTING CONDITIONS</h2><div class="lab-conditions"><span><b>Hair type</b><br>${esc(profile.texture||'Not set')}</span><span><b>Main concerns</b><br>${esc((profile.concerns||[]).join(', ')||'None selected')}</span><span><b>Hair goals</b><br>${esc((profile.goals||[]).join(', ')||'None selected')}</span><span><b>Wash routine</b><br>${esc(profile.frequency||'Not set')}</span></div></article><article class="lab-form-card"><h2>EXPERIMENT DURATION</h2><p class="hint duration-intro">Choose how long you'd like function updateLabRecommendationPreview(product){const box=document.querySelector('#lab-recommendation-list');if(!box||!experimentSetup.productId)return;const selectedProduct=LAB_PRODUCTS.find(p=>p.id===experimentSetup.productId);if(!selectedProduct||product&&product.id!==experimentSetup.productId)return;const draftExperiment={productId:experimentSetup.productId,product:selectedProduct,experimentGoals:experimentSetup.goals.filter(x=>x!=='Other'),selectedObservations:[],baselineHairState:[...(selectedMoods||[])],daysSinceWash:Number(profile.daysSinceWash||0),durationDays:experimentSetup.duration,currentDay:1};box.innerHTML=labRecommendationMarkup(draftExperiment,true)}function bindLabTrialButtons(){document.querySelectorAll("[data-trial]").forEach(button=>button.addEventListener("click",()=>setLabTrial(button,Number(button.dataset.trial))))}
function syncLabGoalButtons(){document.querySelectorAll('[data-lab-goal]').forEach(button=>{const goal=LAB_GOALS[Number(button.dataset.labGoal)],selected=experimentSetup.goals.includes(goal);button.classList.toggle('selected',selected);button.setAttribute('aria-pressed',String(selected))});document.querySelector('#other-goal-wrap')?.classList.toggle('hide',!experimentSetup.goals.includes('Other'))}
function bindLabGoalButtons(){document.querySelectorAll('[data-lab-goal]').forEach(button=>button.addEventListener('click',()=>{const goal=LAB_GOALS[Number(button.dataset.labGoal)];experimentSetup.goals=experimentSetup.goals.includes(goal)?experimentSetup.goals.filter(x=>x!==goal):[...experimentSetup.goals,goal];saveLabDraft();syncLabGoalButtons();document.querySelector('#lab-goal-hint').textContent='Choose any that feel useful to you.';updateLabRecommendationPreview()}))}
function setLabTrial(button,amount){if(![14,21,30].includes(amount)||!experimentSetup.productId)return;experimentSetup.duration=amount;saveLabDraft();document.querySelectorAll('.lab-duration .lab-choice').forEach(x=>{const selected=x===button;x.classList.toggle('selected',selected);x.setAttribute('aria-pressed',String(selected))});const start=document.querySelector('.lab-form>.lab-card-actions .cta');start.textContent=`Begin ${amount}-day experiment`;updateLabRecommendationPreview()}
function startExperiment(productId){const product=LAB_PRODUCTS.find(x=>x.id===productId);if(!product)return;const currentDraft=experimentSetup.productId===productId;const savedDraft=getLabDraft(productId);const draft=currentDraft?{goals:[...experimentSetup.goals],duration:experimentSetup.duration,customGoal:document.querySelector('#other-goal')?.value||savedDraft.customGoal}:savedDraft;const existing=allExperiments().find(e=>e.productId===productId&&(e.status==='active'||e.status==='decision'));if(existing)return showExperimentPage(existing.id);let goals=(draft.goals||[]).filter(x=>x!=='Other');const otherSelected=(draft.goals||[]).includes('Other'),other=String(draft.customGoal||'').trim();if(otherSelected&&!other&&!(product.id===CONDITIONER_PRODUCT_ID&&goals.length)){const hint=document.querySelector('#lab-goal-hint');if(hint){hint.textContent='Add your question for “Other” before starting.';hint.setAttribute('role','alert')}document.querySelector('#other-goal-wrap')?.scrollIntoView({behavior:'smooth',block:'center'});document.querySelector('#other-goal')?.focus({preventScroll:true});return}if(otherSelected&&other)goals.push(other);if(!goals.length){const hint=document.querySelector('#lab-goal-hint');if(hint){hint.textContent='Choose at least one thing you want to find out before starting.';hint.setAttribute('role','alert')}document.querySelector('#lab-goals-card')?.scrollIntoView({behavior:'smooth',block:'center'});document.querySelector('[data-lab-goal]')?.focus({preventScroll:true});return}const now=new Date(),id=`exp-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,duration=Number(draft.duration||14),endDate=new Date(now.getTime()+duration*86400000).toISOString(),record={id,experimentId:id,productId:product.id,product:{...product},hairType:profile.texture||'',concerns:[...(profile.concerns||[])],hairGoals:[...(profile.goals||[])],washFrequency:profile.frequency||'',daysSinceWash:Number(profile.daysSinceWash||0),weatherAtStart:{city:weatherState?.location?.name||profile.city||'',temperature:weatherState?.temperature??null,humidity:weatherState?.humidity??null,precipitationProbability:weatherState?.precipitationProbability??null,condition:weatherState?.condition??null,weatherCode:weatherState?.weatherCode??null,timestamp:weatherState?.timestamp??null,timezone:weatherState?.timezone??null},experimentGoals:goals,goals,selectedObservations:[],observations:[],baselineHairState:[...(selectedMoods||[])],durationDays:duration,duration,trial:{kind:'days',amount:duration},checkInSchedule:'Whenever you use the product',startDate:now.toISOString(),startedAt:now.toISOString(),endDate,currentDay:1,useCount:0,checkins:[],checkIns:[],notes:[],finalDecision:null,decision:null,status:'active',completionStatus:'active'};saveExperiments([record,...allExperiments()]);showExperimentPage(id)}
function deleteExperiment(id){const records=allExperiments(),target=records.find(x=>x.id===id);if(!target||target.status==='complete')return;if(!window.confirm('Delete this experiment? Your check-ins and notes for this experiment will be removed.'))return;saveExperiments(records.filter(x=>x.id!==id));showLab()}
function showExperimentUse(id){const x=allExperiments().find(e=>e.id===id);if(!x)return;labMoodSelection=[...(x.selectedObservations||[])];document.body.classList.remove('welcome-mode','intro-mode');app.innerHTML=`<main class="lab-page lab-form">${labHeader('← Experimental Lab','showLab()')}<div class="eyebrow">ACTIVE EXPERIMENT · CHECK-IN ${x.checkins.length+1}</div><h1>How did your hair respond?</h1><article class="lab-form-card"><h2>${esc(x.product.name)}</h2><p>${x.checkins.length} check-in${x.checkins.length===1?'':'s'} logged during your ${x.durationDays||14}-day experiment</p><div class="lab-choice-grid">${HAIR_MOODS.map((m,i)=>`<button type="button" class="lab-choice ${labMoodSelection.includes(m)?'selected':''}" data-response="${i}" aria-pressed="${labMoodSelection.includes(m)}">${esc(m)}</button>`).join('')}</div><textarea id="lab-use-note" class="lab-note" placeholder="What did you notice? (optional)" style="margin-top:14px"></textarea></article><div class="lab-card-actions"><button class="cta" onclick="saveExperimentUse('${x.id}')">Save check-in</button><button class="lab-secondary" onclick="showLab()">Cancel</button></div></main>`;bindExperimentResponses(id)}
function syncExperimentResponses(){document.querySelectorAll('[data-response]').forEach(button=>{const mood=HAIR_MOODS[Number(button.dataset.response)],selected=labMoodSelection.includes(mood);button.classList.toggle('selected',selected);button.setAttribute('aria-pressed',String(selected))})}
function bindExperimentResponses(id){document.querySelectorAll('[data-response]').forEach(button=>button.addEventListener('click',()=>{const mood=HAIR_MOODS[Number(button.dataset.response)];labMoodSelection=labMoodSelection.includes(mood)?labMoodSelection.filter(x=>x!==mood):[...labMoodSelection,mood];const records=allExperiments(),experiment=records.find(e=>e.id===id);if(experiment){experiment.selectedObservations=[...labMoodSelection];saveExperiments(records)}syncExperimentResponses()}))}
function saveExperimentUse(id){const records=allExperiments(),x=records.find(e=>e.id===id);if(!x)return;const note=document.querySelector('#lab-use-note').value.trim(),entry={date:new Date().toISOString(),use:x.useCount+1,moods:[...labMoodSelection],observations:[...labMoodSelection],note};x.checkins.unshift(entry);x.checkIns=x.checkins;x.selectedObservations=[];x.observations=[...new Set([...(x.observations||[]),...labMoodSelection])];x.notes=x.checkins.map(c=>c.note).filter(Boolean);x.useCount++;x.currentDay=getExperimentDay(x);const elapsed=Math.floor((Date.now()-new Date(x.startDate||x.startedAt).getTime())/86400000);if(getExperimentDay(x)>(x.durationDays||(x.trial?.kind==='days'?x.trial.amount:14))){x.status='decision';x.endDate=new Date().toISOString();x.completionStatus='ready-for-decision';}saveExperiments(records);if(x.status==='decision')showExperimentDecision(id);else showLab()}
function showExperimentDecision(id){const x=allExperiments().find(e=>e.id===id);if(!x)return;document.body.classList.remove('welcome-mode','intro-mode');app.innerHTML=`<main class="lab-page lab-form">${labHeader('← Experimental Lab','showLab()')}<div class="eyebrow">EXPERIMENT CHECKPOINT</div><h1>What feels right?</h1><article class="lab-form-card"><h2>${esc(x.product.name)}</h2><p>You logged ${x.checkins.length} check-in${x.checkins.length===1?'':'s'} across ${x.durationDays||14} days. This is your personal experience, not a proven result.</p><p><b>You wanted to find out:</b> ${(x.experimentGoals||x.goals||[]).map(esc).join(', ')}</p><p><b>What you observed:</b> ${[...new Set(x.checkins.flatMap(c=>c.moods||[]))].map(esc).join(' · ')||'No check-in states selected'}${x.notes?.length?` · ${x.notes.map(esc).join(' · ')}`:''}</p><p><b>Starting point:</b> ${esc(x.hairType||'Not set')} · ${esc((x.concerns||[]).join(', ')||'No concerns selected')} · ${esc((x.hairGoals||[]).join(', ')||'No hair goals selected')} · washes ${esc(x.washFrequency||'as needed')}</p><div class="lab-choice-grid"><button class="lab-choice" onclick="finishExperiment('${x.id}','❤️ Keep using')">❤️ Keep using</button><button class="lab-choice" onclick="finishExperiment('${x.id}','🤔 Still figuring it out')">🤔 Still figuring it out</button><button class="lab-choice" onclick="finishExperiment('${x.id}','👋 Not for me')">👋 Not for me</button></div></article></main>`}
function finishExperiment(id,decision){const records=allExperiments(),x=records.find(e=>e.id===id);if(!x)return;x.decision=decision;x.finalDecision=decision;x.status='complete';x.completionStatus='complete';x.completedAt=new Date().toISOString();x.endDate=x.completedAt;saveExperiments(records);showLab()}
function showDashboard(){document.body.classList.remove('welcome-mode','intro-mode');app.innerHTML=header()+`<main class="dashboard"><div class="dash-head"><div><div class="eyebrow">YOUR PERSONAL CURL FORECAST</div><h1>Good morning${profile.name?`, ${esc(profile.name)}`:''}.</h1><div style="color:var(--muted)">Here’s your hair plan for today.</div></div><div class="profile-chip">${esc(profile.texture==='Not sure'?'Wavy / curly':profile.texture+' '+(['2A','2B','2C'].includes(profile.texture)?'Wavy':'Curly'))} · ${esc(profile.goals?.includes('More definition')?'Definition':profile.goals?.[0]||'Your routine')}</div></div><div class="grid"><section id="weather-box" class="panel weather"></section><section class="panel routine"><div class="eyebrow">YOUR PERSONALIZED PLAN</div><h2 class="section-title">What to try today</h2><label class="hint" for="days-wash">Days since your last wash </label><select id="days-wash" onchange="setDaysSinceWash(this.value)" style="margin:0 0 10px 7px;padding:7px 10px;border:1px solid var(--line);border-radius:4px;background:white;color:var(--ink)">${Array.from({length:8},(_,i)=>`<option value="${i}" ${Number(profile.daysSinceWash||0)===i?'selected':''}>${i}${i===7?'+':''}</option>`).join('')}</select><div id="recommendation-content"></div><p class="hint">A starting point, not a prescription. See what your own hair likes.</p></section><aside class="side"><section class="panel checkin"><div class="eyebrow">A TWO-SECOND CHECK-IN</div><h2 class="section-title">How is your hair feeling today?</h2><div class="moods" role="group" aria-label="Choose one or more descriptions of your hair today">${['😊 Loving it','✨ Defined','☁️ Frizzy','💧 Dry','🫧 Oily','😐 Flat','😣 Tangled'].map((x,i)=>`<button type="button" class="mood ${selectedMoods.includes(x)?'selected':''}" data-mood="${i}" aria-pressed="${selectedMoods.includes(x)}">${x}</button>`).join('')}</div><textarea class="note" id="note" placeholder="Add a note about today’s hair…"></textarea><button class="save-note" onclick="saveCheckin()">Save today’s check-in</button><div id="saved" class="hint"></div></section><section class="panel experiment"><div class="experiment-copy"><div class="eyebrow">YOUR EXPERIMENTAL LAB</div><h3><button class="lab-title-link" onclick="showLab()">Experiment with mini-products</button></h3><p>Try a mini, notice how your curls respond, and decide what works for you.</p></div><img class="experiment-art" src="lab-girl.png" alt="A curious girl looking through a magnifying glass"><button class="coming" onclick="showLab()">Enter the lab →</button></section></aside></div></main><footer class="foot">TRY → CHECK IN → OBSERVE → DECIDE</footer>`;bindMoodButtons();loadCheckin();updateRecommendations();getWeather(profile.city)}function bindMoodButtons(){document.querySelectorAll('[data-mood]').forEach(button=>button.addEventListener('click',()=>{const mood=['😊 Loving it','✨ Defined','☁️ Frizzy','💧 Dry','🫧 Oily','😐 Flat','😣 Tangled'][Number(button.dataset.mood)];selectedMoods=selectedMoods.includes(mood)?selectedMoods.filter(x=>x!==mood):[...selectedMoods,mood];syncMoodButtons();const saved=document.querySelector('#saved');if(saved)saved.textContent='';updateRecommendations()}))}function syncMoodButtons(){document.querySelectorAll('[data-mood]').forEach(button=>{const mood=['😊 Loving it','✨ Defined','☁️ Frizzy','💧 Dry','🫧 Oily','😐 Flat','😣 Tangled'][Number(button.dataset.mood)],selected=selectedMoods.includes(mood);button.classList.toggle('selected',selected);button.setAttribute('aria-pressed',String(selected))})}function setDaysSinceWash(value){profile.daysSinceWash=Number(value);save(STORE,profile);updateRecommendations()}let selectedMoods=[];function saveCheckin(){const feedback=document.querySelector('#saved');if(!selectedMoods.length){feedback.textContent='Pick at least one way your hair is feeling today.';feedback.setAttribute('role','status');return}const all=read(CHECK)||{},today=new Date().toLocaleDateString('en-CA'),entry={moods:[...selec
